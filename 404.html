<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyQuest</title>
    <meta name="description" content="StudyQuest: organização e gamificação pessoal de estudos." />
    <style>
      :root { color-scheme: light; --bg:#f6f7fb; --panel:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --primary:#4f46e5; --accent:#06b6d4; --danger:#e11d48; --ok:#059669; }
      [data-theme="dark"] { color-scheme: dark; --bg:#0f172a; --panel:#111827; --text:#f8fafc; --muted:#94a3b8; --line:#334155; --primary:#818cf8; --accent:#22d3ee; --danger:#fb7185; --ok:#34d399; }
      * { box-sizing: border-box; } body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, var(--bg), #eef2ff); color:var(--text); }
      [data-theme="dark"] body { background: linear-gradient(135deg, #020617, #111827, #172554); }
      button, input, select, textarea { font:inherit; } button { cursor:pointer; border:0; } a { color:inherit; text-decoration:none; }
      .auth { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4); }
      .auth-card, .card { background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line); border-radius:28px; box-shadow:0 20px 45px rgba(15,23,42,.12); padding:24px; }
      .auth-card { width:min(440px,100%); } .logo { font-size:12px; letter-spacing:.35em; text-transform:uppercase; color:var(--primary); font-weight:900; }
      h1,h2,h3 { margin:.2rem 0 .65rem; line-height:1.08; } h1 { font-size:clamp(2rem,5vw,4rem); } h2 { font-size:clamp(1.65rem,3vw,2.5rem); } h3 { font-size:1.25rem; }
      .muted { color:var(--muted); } .grid { display:grid; gap:18px; } .two { grid-template-columns:repeat(2,minmax(0,1fr)); } .three { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .field { display:grid; gap:6px; margin:12px 0; font-weight:700; color:var(--muted); font-size:14px; }
      .input { width:100%; border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--text); padding:12px 14px; outline:none; }
      .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:16px; padding:11px 16px; font-weight:900; background:var(--primary); color:white; transition:.2s; }
      .btn:hover { transform:translateY(-1px); filter:brightness(.96); } .btn.secondary { background:color-mix(in srgb,var(--text) 8%,transparent); color:var(--text); } .btn.danger { background:var(--danger); }
      .app { min-height:100vh; display:grid; grid-template-columns:280px 1fr; } .sidebar { background:#020617; color:white; padding:22px; display:flex; flex-direction:column; gap:16px; position:sticky; top:0; height:100vh; }
      .nav { display:grid; gap:8px; } .nav button { background:transparent; color:#cbd5e1; text-align:left; border-radius:16px; padding:12px 14px; font-weight:800; } .nav button.active,.nav button:hover { background:#4f46e5; color:white; }
      .main { min-width:0; } .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 24px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--panel) 82%,transparent); backdrop-filter:blur(12px); }
      .content { padding:24px; } .hero { background:linear-gradient(135deg,#4f46e5,#06b6d4); color:white; border:0; } .stat { background:rgba(255,255,255,.16); border-radius:22px; padding:16px; }
      .badge { display:inline-flex; align-items:center; border-radius:999px; padding:6px 10px; background:color-mix(in srgb,var(--primary) 12%,transparent); color:var(--primary); font-size:12px; font-weight:900; }
      .progress { height:11px; overflow:hidden; border-radius:999px; background:color-mix(in srgb,var(--text) 10%,transparent); } .bar { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--accent)); }
      .list { display:grid; gap:10px; } .item { background:color-mix(in srgb,var(--text) 5%,transparent); border-radius:18px; padding:14px; }
      .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; } .day { min-height:72px; border:1px solid var(--line); background:color-mix(in srgb,var(--panel) 90%,transparent); border-radius:16px; padding:8px; text-align:left; color:var(--text); } .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin:2px; background:var(--primary); }
      .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; } .tabs button { border-radius:999px; padding:10px 14px; background:color-mix(in srgb,var(--text) 8%,transparent); color:var(--text); font-weight:900; } .tabs button.active { background:var(--primary); color:white; }
      .mobile-menu { display:none; } .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; } .hidden { display:none !important; }
      @media (max-width:900px){ .app{grid-template-columns:1fr}.sidebar{position:fixed; inset:0 auto 0 0; width:280px; transform:translateX(-105%); transition:.2s; z-index:10}.sidebar.open{transform:none}.mobile-menu{display:inline-flex}.two,.three{grid-template-columns:1fr}.content{padding:16px}.calendar{gap:5px}.day{min-height:56px;padding:6px}.overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:9}} 
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const confidenceOptions = ['Chutei','Estava muito incerta','Estava em dúvida entre alternativas','Estava confiante','Sabia com certeza'];
      const seed = {
        users:[{id:'demo',name:'Estudante StudyQuest',email:'demo@studyquest.app',password:'123456',xp:760,streak:8,achievements:['Primeira sessão','Sequência de 7 dias','Mestre dos flashcards']}], currentUserId:null, theme:'light', answers:[],
        subjects:[
          {id:'calculo',name:'Cálculo II',color:'#8b5cf6',description:'Integrais múltiplas, séries e campos vetoriais.',priority:'Alta',contents:['Integrais duplas','Séries de Taylor','Teorema de Green'],progress:55},
          {id:'fluidos',name:'Mecânica dos Fluidos',color:'#06b6d4',description:'Hidrostática, escoamentos e conservação de energia.',priority:'Alta',contents:['Equação de Bernoulli','Número de Reynolds'],progress:60},
          {id:'materiais',name:'Ciência dos Materiais',color:'#f97316',description:'Estruturas, propriedades e ensaios mecânicos.',priority:'Média',contents:['Metais','Diagramas de fase'],progress:52},
          {id:'fisica',name:'Física',color:'#22c55e',description:'Leis de Newton, energia, ondas e eletromagnetismo.',priority:'Baixa',contents:['Ondas','Energia'],progress:80}
        ],
        exams:[
          {id:'p1',title:'Prova de Cálculo II',subjectId:'calculo',date:'2026-05-12',time:'08:00',difficulty:'alta',weight:9,status:'estudando',contents:'Integrais duplas, Séries de Taylor'},
          {id:'p2',title:'Prova de Mecânica dos Fluidos',subjectId:'fluidos',date:'2026-05-16',time:'10:00',difficulty:'alta',weight:10,status:'não iniciado',contents:'Bernoulli, Reynolds'},
          {id:'p3',title:'Prova de Ciência dos Materiais',subjectId:'materiais',date:'2026-05-23',time:'14:00',difficulty:'média',weight:8,status:'quase pronto',contents:'Metais, Diagramas de fase'}
        ],
        tasks:[
          {id:'t1',title:'Resolver lista de Cálculo',description:'Lista de integrais múltiplas.',subjectId:'calculo',date:'2026-05-07',time:'19:00',type:'tarefa',priority:'Alta',status:'pendente'},
          {id:'t2',title:'Estudar Equação de Bernoulli',description:'Revisão ativa com exercícios.',subjectId:'fluidos',date:'2026-05-08',time:'18:00',type:'revisão',priority:'Alta',status:'em andamento'},
          {id:'t3',title:'Entregar relatório de Ciência dos Materiais',description:'Relatório sobre ensaio de tração.',subjectId:'materiais',date:'2026-05-05',time:'23:59',type:'trabalho',priority:'Alta',status:'pendente'},
          {id:'t4',title:'Revisar propriedades mecânicas dos metais',description:'Resumo + flashcards.',subjectId:'materiais',date:'2026-05-10',time:'16:00',type:'revisão',priority:'Média',status:'pendente'},
          {id:'t5',title:'Apresentação de projeto integrador',description:'Simular apresentação.',subjectId:'fisica',date:'2026-05-14',time:'09:00',type:'apresentação',priority:'Média',status:'pendente'},
          {id:'t6',title:'Evento acadêmico de engenharia',description:'Palestra sobre materiais sustentáveis.',subjectId:'materiais',date:'2026-05-21',time:'15:00',type:'evento acadêmico',priority:'Baixa',status:'pendente'}
        ],
        questions:[
          {id:'q1',statement:'Qual técnica é adequada para calcular integrais duplas em regiões não retangulares?',subjectId:'calculo',content:'Integrais duplas',type:'múltipla escolha',alternatives:['Descrever a região com limites variáveis','Ignorar a ordem','Aplicar derivadas','Usar constantes'],correctAnswer:'Descrever a região com limites variáveis',explanation:'A região determina os limites de integração.'},
          {id:'q2',statement:'A equação de Bernoulli relaciona pressão, velocidade e altura em um escoamento ideal.',subjectId:'fluidos',content:'Bernoulli',type:'verdadeiro ou falso',alternatives:['Verdadeiro','Falso'],correctAnswer:'Verdadeiro',explanation:'Ela expressa conservação de energia mecânica.'},
          {id:'q3',statement:'O aumento de discordâncias tende a elevar qual propriedade dos metais?',subjectId:'materiais',content:'Metais',type:'múltipla escolha',alternatives:['Dureza','Transparência','Massa molar','Condutividade perfeita'],correctAnswer:'Dureza',explanation:'Discordâncias dificultam deformação plástica.'},
          {id:'q4',statement:'Em sistema conservativo, a energia mecânica total permanece constante.',subjectId:'fisica',content:'Energia',type:'flashcard',alternatives:['Verdadeiro','Falso'],correctAnswer:'Verdadeiro',explanation:'Sem forças dissipativas, energia se conserva.'}
        ]
      };
      const key='studyquest:standalone:v2';
      let state = JSON.parse(localStorage.getItem(key) || 'null') || seed;
      const $ = (s) => document.querySelector(s); const save=()=>localStorage.setItem(key,JSON.stringify(state));
      const user=()=>state.users.find(u=>u.id===state.currentUserId); const subj=(id)=>state.subjects.find(s=>s.id===id)?.name || 'Sem matéria';
      const level=(xp)=>Math.floor((xp||0)/250)+1; const perf=(sid)=>{const qs=state.questions.filter(q=>q.subjectId===sid).map(q=>q.id); const a=state.answers.filter(x=>qs.includes(x.questionId)); if(!a.length)return 50; return Math.round((a.filter(x=>x.correct).length/a.length)*100);};
      const priority=(s)=>{let p=70-perf(s.id)+(s.priority==='Alta'?25:s.priority==='Média'?10:0)+state.exams.filter(e=>e.subjectId===s.id).length*12+state.tasks.filter(t=>t.subjectId===s.id&&t.status!=='concluída').length*9; return {score:Math.max(0,p),label:p>70?'Alta':p>40?'Média':'Baixa'};};
      function setTheme(t){state.theme=t; document.documentElement.dataset.theme=t; save();} setTheme(state.theme || 'light');
      function route(to){location.hash=to; render();} window.addEventListener('hashchange',render);
      function login(register=false){ const name=$('#name')?.value || 'Estudante'; const email=$('#email').value; const password=$('#password').value; if(register){ if(state.users.some(u=>u.email===email)) return alert('E-mail já cadastrado.'); const u={id:crypto.randomUUID(),name,email,password,xp:0,streak:1,achievements:['Conta criada']}; state.users.push(u); state.currentUserId=u.id; } else { const u=state.users.find(u=>u.email===email&&u.password===password); if(!u) return alert('Use demo@studyquest.app / 123456 ou cadastre uma conta.'); state.currentUserId=u.id; } save(); route('/'); }
      function logout(){state.currentUserId=null; save(); render();}
      function shell(page){ const u=user(); return `<div class="app"><aside id="sidebar" class="sidebar"><div><p class="logo">StudyQuest</p><h2>Level up studies</h2></div><nav class="nav">${['Dashboard:/','Calendário:/calendario','Matérias:/materias','Provas:/provas','Tarefas:/tarefas','Questões:/questoes','Flashcards:/flashcards','Perfil:/perfil','Configurações:/configuracoes'].map(x=>{const [l,r]=x.split(':');return `<button class="${hash()===r?'active':''}" onclick="route('${r}')">${l}</button>`}).join('')}</nav><button class="btn danger" onclick="logout()">Sair</button></aside><main class="main"><header class="top"><button class="btn secondary mobile-menu" onclick="toggleMenu()">☰</button><div><div class="muted">Olá, ${u.name.split(' ')[0]} 👋</div><strong>Organize, revise e ganhe XP</strong></div><button class="btn secondary" onclick="setTheme(state.theme==='dark'?'light':'dark');render()">${state.theme==='dark'?'☀️':'🌙'}</button></header><section class="content">${page}</section></main></div>`; }
      function hash(){return location.hash.replace('#','') || '/';} function toggleMenu(){ $('#sidebar').classList.toggle('open'); }
      function auth(register=false){ return `<div class="auth"><section class="auth-card"><p class="logo">StudyQuest</p><h1>${register?'Cadastro':'Login'}</h1><p class="muted">Entre para acessar a plataforma. Demo: demo@studyquest.app / 123456.</p>${register?'<label class="field">Nome<input id="name" class="input" value="Estudante"></label>':''}<label class="field">E-mail<input id="email" class="input" type="email" value="demo@studyquest.app"></label><label class="field">Senha<input id="password" class="input" type="password" value="123456"></label><button class="btn" onclick="login(${register})">${register?'Cadastrar':'Entrar'}</button><button class="btn secondary" onclick="route('${register?'/login':'/cadastro'}')">${register?'Já tenho conta':'Criar conta'}</button></section></div>`; }
      function calendar(){ const acts=[...state.exams.map(e=>({...e,type:'prova'})),...state.tasks]; return `<div class="calendar">${Array.from({length:31},(_,i)=>{const d=`2026-05-${String(i+1).padStart(2,'0')}`; const a=acts.filter(x=>x.date===d); return `<button class="day" onclick="alert('${a.length? a.map(x=>`${x.title} - ${x.time} (${x.type})`).join('\\n'):'Nenhuma atividade neste dia.'}')"><strong>${i+1}</strong><div>${a.map(x=>'<span class="dot"></span>').join('')}</div></button>`}).join('')}</div>`; }
      function dashboard(){ const u=user(), pr=[...state.subjects].map(s=>({s,...priority(s)})).sort((a,b)=>b.score-a.score); return shell(`<section class="card hero"><p>Bom estudo, ${u.name}!</p><h1>Missão diária: priorizar o que mais importa.</h1><div class="grid three"><div class="stat">XP<br><strong>${u.xp}</strong></div><div class="stat">Nível<br><strong>${level(u.xp)}</strong></div><div class="stat">Sequência<br><strong>🔥 ${u.streak} dias</strong></div></div><p><button class="btn" onclick="route('/questoes')">Estudar agora</button></p></section><div class="grid two"><section class="card"><h3>Prioridades de hoje</h3>${pr.map(p=>`<div class="item"><strong>${p.s.name}</strong> <span class="badge">${p.label}</span><div class="progress"><div class="bar" style="width:${Math.min(100,p.score)}%"></div></div></div>`).join('')}</section><section class="card"><h3>Calendário do mês</h3>${calendar()}</section><section class="card"><h3>Próximas tarefas</h3>${state.tasks.slice(0,4).map(t=>`<div class="item">${t.title}<br><span class="muted">${t.date} às ${t.time}</span></div>`).join('')}</section><section class="card"><h3>Próximas provas</h3>${state.exams.map(e=>`<div class="item">${e.title}<br><span class="muted">${e.date} • ${e.status}</span></div>`).join('')}</section></div>`); }
      function subjects(){ return shell(`<div class="row"><h1>Matérias</h1><button class="btn" onclick="addSubject()">Cadastrar matéria</button></div><div class="grid two">${state.subjects.map(s=>`<section class="card"><div style="height:8px;border-radius:99px;background:${s.color}"></div><h2>${s.name}</h2><p class="muted">${s.description}</p><p><span class="badge">Prioridade ${priority(s).label}</span> <span class="badge">${s.contents.length} conteúdos</span> <span class="badge">${perf(s.id)}% desempenho</span></p><div class="progress"><div class="bar" style="width:${s.progress}%"></div></div><p><button class="btn" onclick="subjectDetails('${s.id}')">Abrir detalhes</button><button class="btn secondary" onclick="editSubject('${s.id}')">Editar</button><button class="btn danger" onclick="del('subjects','${s.id}')">Excluir</button></p></section>`).join('')}</div>`); }
      function subjectDetails(id){ const s=state.subjects.find(x=>x.id===id); $('#root').innerHTML=shell(`<h1>${s.name}</h1><p class="muted">${s.description}</p><p><span class="badge">Prioridade ${priority(s).label}</span> <span class="badge">Desempenho ${perf(s.id)}%</span> <span class="badge">Progresso ${s.progress}%</span></p><div class="tabs"><button class="active">Conteúdos</button><button>Tarefas</button><button>Provas</button><button>Questões</button><button>Desempenho</button></div><section class="card"><h3>Conteúdos</h3>${s.contents.map(c=>`<div class="item">${c}</div>`).join('')}<h3>Tarefas relacionadas</h3>${state.tasks.filter(t=>t.subjectId===id).map(t=>`<div class="item">${t.title} • ${t.status}</div>`).join('')}<h3>Provas relacionadas</h3>${state.exams.filter(e=>e.subjectId===id).map(e=>`<div class="item">${e.title} • ${e.date}</div>`).join('')}<h3>Questões relacionadas</h3>${state.questions.filter(q=>q.subjectId===id).map(q=>`<div class="item">${q.statement}</div>`).join('')}</section>`); }
      function listPage(type){ const arr=state[type]; return shell(`<div class="row"><h1>${type==='exams'?'Provas':'Tarefas'}</h1><button class="btn" onclick="addItem('${type}')">Cadastrar</button></div><div class="grid two">${arr.map(x=>`<section class="card"><h2>${x.title}</h2><p class="muted">${subj(x.subjectId)} • ${x.date} às ${x.time}</p><p>${x.description||x.contents||''}</p><p><span class="badge">${x.status}</span> ${x.priority?`<span class="badge">${x.priority}</span>`:''}</p><button class="btn secondary" onclick="addItem('${type}','${x.id}')">Editar</button> <button class="btn danger" onclick="del('${type}','${x.id}')">Excluir</button> ${type==='tasks'&&x.status!=='concluída'?`<button class="btn" onclick="completeTask('${x.id}')">Concluir +XP</button>`:''}</section>`).join('')}</div>`); }
      function questions(){ return shell(`<h1>Questões</h1><div class="grid">${state.questions.map(q=>`<section class="card"><p><span class="badge">${subj(q.subjectId)}</span> <span class="badge">${q.content}</span></p><h3>${q.statement}</h3>${q.alternatives.map(a=>`<label class="item"><input name="${q.id}" type="radio" value="${a}"> ${a}</label>`).join('')}<label class="field">Como você se sentiu ao responder essa questão?<select class="input" id="conf-${q.id}">${confidenceOptions.map(c=>`<option>${c}</option>`).join('')}</select></label><button class="btn" onclick="answer('${q.id}')">Responder e salvar</button><p class="muted">${q.explanation}</p></section>`).join('')}</div>`); }
      function answer(id){ const q=state.questions.find(q=>q.id===id); const sel=document.querySelector(`input[name="${id}"]:checked`)?.value; if(!sel)return alert('Escolha uma alternativa.'); const correct=sel===q.correctAnswer; state.answers.push({id:crypto.randomUUID(),questionId:id,subjectId:q.subjectId,selected:sel,confidence:$(`#conf-${id}`).value,correct}); user().xp += correct?35:10; save(); alert(`${correct?'Acertou!':'Errou.'} Confiança salva.`); render(); }
      function flashcards(){ return shell(`<h1>Flashcards</h1><div class="grid two">${state.questions.filter(q=>q.type==='flashcard'||q.type==='verdadeiro ou falso').map(q=>`<section class="card"><span class="badge">${subj(q.subjectId)}</span><h3>${q.statement}</h3><details class="item"><summary>Ver resposta</summary><strong>${q.correctAnswer}</strong><p>${q.explanation}</p></details><button class="btn" onclick="user().xp+=20;save();render()">Marcar revisão +XP</button></section>`).join('')}</div>`); }
      function profile(){ const u=user(); return shell(`<h1>Perfil</h1><section class="card"><h2>${u.name}</h2><p class="muted">${u.email}</p><p><span class="badge">${u.xp} XP</span> <span class="badge">Nível ${level(u.xp)}</span> <span class="badge">🔥 ${u.streak} dias</span></p><h3>Conquistas</h3>${u.achievements.map(a=>`<span class="badge">🏆 ${a}</span>`).join(' ')}</section>`); }
      function settings(){ return shell(`<h1>Configurações</h1><section class="card"><h3>Tema</h3><p class="muted">A escolha fica salva no LocalStorage.</p><button class="btn" onclick="setTheme(state.theme==='dark'?'light':'dark');render()">Alternar tema</button></section><section class="card"><h3>Dados locais</h3><button class="btn danger" onclick="localStorage.removeItem(key);state=seed;save();render()">Restaurar demo</button></section>`); }
      function addSubject(){ const name=prompt('Nome da matéria:'); if(!name)return; state.subjects.push({id:crypto.randomUUID(),name,color:'#4f46e5',description:prompt('Descrição:')||'',priority:'Média',contents:[],progress:0}); save(); render(); }
      function editSubject(id){ const s=state.subjects.find(x=>x.id===id); const name=prompt('Nome:',s.name); if(name){s.name=name; s.description=prompt('Descrição:',s.description)||s.description; save(); render();} }
      function addItem(type,id){ const arr=state[type], x=arr.find(i=>i.id===id)||{}; const title=prompt('Título:',x.title||''); if(!title)return; const obj={...x,id:id||crypto.randomUUID(),title,subjectId:state.subjects[0].id,date:prompt('Data:',x.date||'2026-05-20')||'2026-05-20',time:prompt('Horário:',x.time||'18:00')||'18:00',status:x.status||'pendente',priority:x.priority||'Média',type:x.type||'tarefa',description:x.description||'',contents:x.contents||''}; if(id) Object.assign(x,obj); else arr.push(obj); save(); render(); }
      function completeTask(id){ const t=state.tasks.find(t=>t.id===id); t.status='concluída'; user().xp+=35; save(); render(); }
      function del(type,id){ if(confirm('Excluir item?')){ state[type]=state[type].filter(x=>x.id!==id); save(); render(); } }
      function render(){ const r=hash(); if(!user() && !['/login','/cadastro'].includes(r)) return route('/login'); if(r==='/login') $('#root').innerHTML=auth(false); else if(r==='/cadastro') $('#root').innerHTML=auth(true); else if(r==='/') $('#root').innerHTML=dashboard(); else if(r==='/calendario') $('#root').innerHTML=shell(`<h1>Calendário</h1><section class="card">${calendar()}</section>`); else if(r==='/materias') $('#root').innerHTML=subjects(); else if(r==='/provas') $('#root').innerHTML=listPage('exams'); else if(r==='/tarefas') $('#root').innerHTML=listPage('tasks'); else if(r==='/questoes') $('#root').innerHTML=questions(); else if(r==='/flashcards') $('#root').innerHTML=flashcards(); else if(r==='/perfil') $('#root').innerHTML=profile(); else if(r==='/configuracoes') $('#root').innerHTML=settings(); else route('/'); }
      render();
    </script>
  </body>
</html>
