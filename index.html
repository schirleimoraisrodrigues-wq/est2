  <style>
    :root{--bg:#f7f7f5;--surface:#fff;--surface-2:#f1f3f1;--text:#18201c;--muted:#6d766f;--line:#e1e5e0;--accent:#2f6f5e;--accent-2:#e7f1ed;--danger:#a33d3d;--warn:#946200;--shadow:0 14px 36px rgba(24,32,28,.08)}
    [data-theme=dark]{--bg:#101411;--surface:#171d19;--surface-2:#202822;--text:#edf2ee;--muted:#a4afa8;--line:#303a33;--accent:#8dd5bc;--accent-2:#1d332b;--danger:#ff9a9a;--warn:#e8c47d;--shadow:none}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer} h1,h2,h3{margin:0 0 10px;line-height:1.12} h1{font-size:clamp(28px,4vw,44px)} h2{font-size:24px} h3{font-size:17px} p{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:13px}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:22px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}.brand{letter-spacing:.18em;text-transform:uppercase;font-weight:800;font-size:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 12px;text-align:left;font-weight:650}.nav button:hover,.nav button.active{background:var(--surface-2);color:var(--text)}.top{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}.content{padding:28px;max-width:1280px}.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.flat{box-shadow:none}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 13px;font-weight:700}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}.btn.danger{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;color:var(--muted);background:var(--surface)}.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:999px}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:10px 11px}.field{display:grid;gap:6px;color:var(--muted);font-weight:650;font-size:13px}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:68px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;color:var(--text)}.day:hover{border-color:var(--accent)}.dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--accent);margin:2px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 12px;font-weight:700}.tabs button.active{background:var(--accent-2);color:var(--accent);border-color:var(--accent-2)}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth .card{width:min(420px,100%)}.question{max-width:820px;margin:auto}.alt{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:13px}.alt.selected{border-color:var(--accent);background:var(--accent-2)}.mobile{display:none}.item{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px}.mono{font-variant-numeric:tabular-nums}.attention{border-left:3px solid var(--accent)}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;transform:translateX(-105%);transition:.2s;width:260px}.sidebar.open{transform:none}.mobile{display:inline-flex}.top{padding:14px 16px}.content{padding:16px}.two,.three,.four,.form{grid-template-columns:1fr}.calendar{gap:4px}.day{min-height:52px;padding:6px}.hide-sm{display:none}}
  </style>
</head>

<script>
const today='2026-05-06';
const confidenceLevels=['Chutei','Estava muito incerta','Estava em dúvida entre alternativas','Estava confiante','Sabia com certeza'];
const reviewResults=['errei','lembrei com dificuldade','lembrei parcialmente','lembrei bem','muito fácil'];
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const seed={

 topics:[{id:'t-bern',subjectId:'s-fluidos',title:'Equação de Bernoulli',description:'Conservação de energia em escoamento ideal.',difficulty:'média',status:'estudando',priority:'alta'},{id:'t-orif',subjectId:'s-fluidos',title:'Orifícios e vazão',description:'Aplicações de Bernoulli em descarga e medição.',difficulty:'alta',status:'revisando',priority:'alta'},{id:'t-int',subjectId:'s-calc',title:'Integrais duplas',description:'Integração em regiões planas.',difficulty:'alta',status:'estudando',priority:'média'},{id:'t-metais',subjectId:'s-materiais',title:'Propriedades mecânicas dos metais',description:'Dureza, ductilidade e resistência.',difficulty:'média',status:'revisando',priority:'média'}],
 contents:[{id:'c-bern-intro',subjectId:'s-fluidos',topicId:'t-bern',title:'Introdução à Equação de Bernoulli',type:'resumo',description:'Hipóteses, termos de energia e interpretação.',body:'A Equação de Bernoulli relaciona pressão, velocidade e altura em escoamento ideal, incompressível e permanente.',fileUrl:'',externalLink:'',status:'estudado',lastReviewedAt:'2026-04-21',createdAt:'2026-05-01'},{id:'c-orif',subjectId:'s-fluidos',topicId:'t-orif',title:'Aplicações em orifícios',type:'PDF',description:'Coeficientes e descarga por orifícios.',body:'',fileUrl:'https://exemplo.com/bernoulli-orificios.pdf',externalLink:'',status:'revisar',lastReviewedAt:'2026-04-12',createdAt:'2026-05-01'},{id:'c-pressao',subjectId:'s-fluidos',topicId:'t-bern',title:'Pressão, velocidade e altura',type:'texto escrito',description:'Relação entre energia de pressão, cinética e potencial.',body:'A soma das parcelas de energia permanece constante ao longo de uma linha de corrente ideal.',fileUrl:'',externalLink:'',status:'estudando',lastReviewedAt:'2026-04-28',createdAt:'2026-05-02'},{id:'c-int',subjectId:'s-calc',topicId:'t-int',title:'Regiões de integração',type:'anotação',description:'Como descrever limites variáveis.',body:'Descrever a região corretamente é o passo central para integrais duplas.',fileUrl:'',externalLink:'',status:'estudando',lastReviewedAt:'2026-04-24',createdAt:'2026-05-02'}],
 questions:[{id:'q1',subjectId:'s-fluidos',topicId:'t-bern',contentId:'c-bern-intro',statement:'O que a Equação de Bernoulli conserva em um escoamento ideal?',type:'múltipla escolha',alternatives:['Energia mecânica por unidade de peso','Massa molar do fluido','Temperatura absoluta','Viscosidade dinâmica'],correctAnswer:'Energia mecânica por unidade de peso',explanation:'Bernoulli expressa a conservação da energia mecânica entre pressão, velocidade e altura.',difficulty:'média',tags:['bernoulli','energia'],source:'Demo',status:'ativa'},{id:'q2',subjectId:'s-fluidos',topicId:'t-orif',contentId:'c-orif',statement:'Em um orifício, a vazão aumenta quando a diferença de carga hidráulica aumenta.',type:'verdadeiro ou falso',alternatives:['Verdadeiro','Falso'],correctAnswer:'Verdadeiro',explanation:'A velocidade ideal de saída é proporcional à raiz da carga hidráulica.',difficulty:'média',tags:['vazão'],source:'Demo',status:'ativa'},{id:'q3',subjectId:'s-fluidos',topicId:'t-bern',contentId:'c-pressao',statement:'Se a velocidade aumenta e a altura é constante, o que tende a ocorrer com a pressão estática em Bernoulli ideal?',type:'múltipla escolha',alternatives:['Diminui','Aumenta sempre','Fica obrigatoriamente zero','Não se altera'],correctAnswer:'Diminui',explanation:'Com altura constante, aumento de energia cinética reduz a parcela de pressão.',difficulty:'alta',tags:['pressão','velocidade'],source:'Demo',status:'ativa'},{id:'q4',subjectId:'s-calc',topicId:'t-int',contentId:'c-int',statement:'Em regiões não retangulares, os limites de integração podem depender da variável externa.',type:'verdadeiro ou falso',alternatives:['Verdadeiro','Falso'],correctAnswer:'Verdadeiro',explanation:'A geometria da região determina limites variáveis.',difficulty:'média',tags:['integrais'],source:'Demo',status:'ativa'}],
 flashcards:[{id:'f1',subjectId:'s-fluidos',topicId:'t-bern',contentId:'c-bern-intro',front:'O que a Equação de Bernoulli conserva?',back:'A energia mecânica do fluido em escoamento ideal.',difficulty:'média',lastReviewedAt:'2026-04-20',mastery:'médio'},{id:'f2',subjectId:'s-fluidos',topicId:'t-orif',contentId:'c-orif',front:'Qual grandeza mais influencia a vazão ideal em orifícios?',back:'A carga hidráulica disponível.',difficulty:'alta',lastReviewedAt:'2026-04-13',mastery:'baixo'},{id:'f3',subjectId:'s-calc',topicId:'t-int',contentId:'c-int',front:'Qual é o primeiro passo em uma integral dupla?',back:'Descrever corretamente a região de integração.',difficulty:'média',lastReviewedAt:'2026-04-24',mastery:'médio'}],
 events:[{id:'e1',title:'Revisão de Bernoulli',description:'Lista curta e flashcards.',date:'2026-05-07',time:'18:30',type:'revisão',subjectId:'s-fluidos',topicId:'t-bern',priority:'alta',status:'pendente'},{id:'e2',title:'Entrega do relatório',description:'Relatório de materiais.',date:'2026-05-09',time:'23:00',type:'trabalho',subjectId:'s-materiais',topicId:'t-metais',priority:'alta',status:'pendente'},{id:'e3',title:'Simulado de Cálculo',description:'Integrais duplas.',date:'2026-05-13',time:'15:00',type:'simulado',subjectId:'s-calc',topicId:'t-int',priority:'média',status:'pendente'}],
 exams:[{id:'x1',title:'Prova de Mecânica dos Fluidos',subjectId:'s-fluidos',date:'2026-05-16',time:'10:00',topics:['t-bern','t-orif'],contents:['c-bern-intro','c-orif','c-pressao'],difficulty:'alta',importance:10,preparationStatus:'em andamento',notes:'Priorizar Bernoulli e orifícios.'},{id:'x2',title:'Prova de Cálculo II',subjectId:'s-calc',date:'2026-05-21',time:'08:00',topics:['t-int'],contents:['c-int'],difficulty:'média',importance:8,preparationStatus:'comecei',notes:'Revisar limites de integração.'}]
};
const clone=v=>JSON.parse(JSON.stringify(v));const key='studyquest:minimal:v1';let db=JSON.parse(localStorage.getItem(key)||'null')||clone(seed);let session=null;const $=s=>document.querySelector(s);const save=()=>localStorage.setItem(key,JSON.stringify(db));
function setTheme(t){db.theme=t;document.documentElement.dataset.theme=t;save()}setTheme(db.theme||'light');
const by=(arr,id)=>arr.find(x=>x.id===id);const subjectName=id=>by(db.subjects,id)?.name||'Sem matéria';const topicName=id=>by(db.topics,id)?.title||'Sem tópico';const contentName=id=>by(db.contents,id)?.title||'Sem conteúdo';
const daysUntil=d=>Math.ceil((new Date(d+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);const avg=a=>a.length?a.reduce((s,n)=>s+n,0)/a.length:0;const confScore=c=>confidenceLevels.indexOf(c)+1;
function attemptsFor(filter){return db.attempts.filter(a=>(!filter.subjectId||a.subjectId===filter.subjectId)&&(!filter.topicId||a.topicId===filter.topicId)&&(!filter.contentId||a.contentId===filter.contentId))}
function performance(filter={}){const a=attemptsFor(filter);const correct=a.filter(x=>x.isCorrect).length;const confidence=avg(a.map(x=>confScore(x.confidenceLevel)||3));return{total:a.length,correct,wrong:a.length-correct,accuracy:a.length?Math.round(correct/a.length*100):50,confidence:Math.round(confidence*20)}}
function priorityForContent(c){let score=0;const perf=performance({contentId:c.id});score+=Math.max(0,70-perf.accuracy);if(daysUntil(c.lastReviewedAt)<-10)score+=18;db.attempts.filter(a=>a.contentId===c.id).forEach(a=>{if(a.isCorrect&&a.confidenceLevel==='Sabia com certeza')score-=18; if(a.isCorrect&&a.confidenceLevel==='Estava confiante')score-=10; if(a.isCorrect&&a.confidenceLevel==='Estava em dúvida entre alternativas')score+=2; if(a.isCorrect&&['Estava muito incerta','Chutei'].includes(a.confidenceLevel))score+=18; if(!a.isCorrect&&a.confidenceLevel==='Chutei')score+=24; if(!a.isCorrect&&['Estava confiante','Sabia com certeza'].includes(a.confidenceLevel))score+=38;});db.flashcards.filter(f=>f.contentId===c.id&&['baixo','médio'].includes(f.mastery)).forEach(()=>score+=8);db.exams.filter(e=>e.contents.includes(c.id)&&daysUntil(e.date)>=0&&daysUntil(e.date)<=14).forEach(e=>score+=Number(e.importance)*2);return Math.max(0,Math.round(score))}
function priorityLabel(score){return score>=80?'urgente':score>=55?'alta':score>=30?'média':'baixa'}
function subjectPriority(s){const cs=db.contents.filter(c=>c.subjectId===s.id);const score=Math.round(avg(cs.map(priorityForContent)));return{score,label:priorityLabel(score)}}
function xpLevel(){return Math.floor((db.user.xp||0)/250)+1}function route(r){db.route=r;save();render()}function toggleMenu(){$('#side')?.classList.toggle('open')}
function shell(html){const nav=[['dashboard','⌂','Dashboard'],['agenda','□','Agenda'],['materias','◫','Matérias'],['provas','◇','Provas'],['tarefas','✓','Tarefas'],['questoes','?','Questões'],['flashcards','◈','Flashcards'],['desempenho','↗','Desempenho'],['config','⚙','Configurações']];return`<div class="app"><aside id="side" class="sidebar"><div><div class="brand">StudyQuest</div><p class="muted small">Estudo ativo minimalista</p></div><nav class="nav">${nav.map(n=>`<button class="${db.route===n[0]?'active':''}" onclick="route('${n[0]}')"><span class="mono">${n[1]}</span> ${n[2]}</button>`).join('')}</nav><div class="card flat small"><b>Nível ${xpLevel()}</b><p class="muted">${db.user.xp} XP · meta ${db.user.dailyGoal} questões/dia</p><div class="progress"><div class="bar" style="width:${(db.user.xp%250)/2.5}%"></div></div></div></aside><main><header class="top"><button class="btn mobile" onclick="toggleMenu()">Menu</button><div><b>${db.user.name}</b><div class="muted small">Plataforma de estudos e revisão inteligente</div></div><button class="btn" onclick="setTheme(db.theme==='dark'?'light':'dark');render()">${db.theme==='dark'?'Tema claro':'Tema escuro'}</button></header><section class="content">${html}</section></main></div>`}
function calendar(compact=false){const all=[...db.events,...db.exams.map(e=>({id:e.id,title:e.title,date:e.date,time:e.time,type:'prova',subjectId:e.subjectId,priority:e.difficulty,status:e.preparationStatus}))];return`<div class="calendar">${Array.from({length:31},(_,i)=>{const d=`2026-05-${String(i+1).padStart(2,'0')}`;const ev=all.filter(e=>e.date===d);return`<button class="day" onclick="showDay('${d}')"><b>${i+1}</b><div>${ev.slice(0,5).map(()=>'<span class="dot"></span>').join('')}</div><small class="muted">${ev.length?ev.length+' evento(s)':''}</small></button>`}).join('')}</div>`}
function showDay(d){const all=[...db.events,...db.exams.map(e=>({id:e.id,title:e.title,date:e.date,time:e.time,type:'prova',subjectId:e.subjectId,priority:e.difficulty,status:e.preparationStatus}))].filter(e=>e.date===d);alert(all.length?all.map(e=>`${e.time} · ${e.title} (${e.type}) · ${subjectName(e.subjectId)}`).join('\n'):'Nenhum evento neste dia.')}
function dashboard(){const priorities=db.contents.map(c=>({c,score:priorityForContent(c)})).sort((a,b)=>b.score-a.score);const weak=db.subjects.map(s=>({s,p:performance({subjectId:s.id}),pr:subjectPriority(s)})).sort((a,b)=>a.p.accuracy-b.p.accuracy);return shell(`<div class="between"><div><h1>Olá, ${db.user.name}</h1><p class="muted">Resumo do dia com foco no que mais precisa de revisão.</p></div><button class="btn primary" onclick="startSmartStudy()">Estudar agora</button></div><div class="grid four"><section class="card"><span class="muted small">Hoje</span><h3>${db.events.filter(e=>e.date===today).length} eventos</h3></section><section class="card"><span class="muted small">Questões</span><h3>${performance().total} respondidas</h3></section><section class="card"><span class="muted small">Desempenho</span><h3>${performance().accuracy}%</h3></section><section class="card"><span class="muted small">XP discreto</span><h3>${db.user.xp} · nível ${xpLevel()}</h3></section></div><div class="grid two"><section class="card"><h3>Calendário do mês</h3>${calendar(true)}</section><section class="card"><h3>Prioridades de estudo</h3>${priorities.slice(0,5).map(x=>`<div class="item attention"><b>${x.c.title}</b><p class="muted small">${subjectName(x.c.subjectId)} · ${topicName(x.c.topicId)} · prioridade ${priorityLabel(x.score)}</p><div class="progress"><div class="bar" style="width:${Math.min(100,x.score)}%"></div></div></div>`).join('')}</section><section class="card"><h3>Próximas provas</h3>${db.exams.map(e=>`<div class="item"><b>${e.title}</b><p class="muted small">${e.date} ${e.time} · ${subjectName(e.subjectId)} · ${e.preparationStatus}</p></div>`).join('')}</section><section class="card"><h3>Mais atenção</h3>${weak.slice(0,4).map(x=>`<div class="item"><b>${x.s.name}</b><p class="muted small">${x.p.accuracy}% desempenho · prioridade ${x.pr.label}</p></div>`).join('')}</section></div>`)}
function agenda(){return shell(`<div class="between"><div><h1>Agenda</h1><p class="muted">Eventos conectados a matérias e tópicos.</p></div></div><section class="card"><h3>Novo evento</h3><div class="form"><label class="field">Título<input id="ev-title" class="input"></label><label class="field">Data<input id="ev-date" class="input" type="date" value="${today}"></label><label class="field">Horário<input id="ev-time" class="input" type="time" value="18:00"></label><label class="field">Tipo<select id="ev-type" class="input">${['prova','trabalho','tarefa','revisão','apresentação','aula','evento acadêmico','simulado','outro'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Matéria<select id="ev-subject" class="input"><option value="">Sem matéria</option>${db.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label class="field">Prioridade<select id="ev-priority" class="input"><option>baixa</option><option>média</option><option>alta</option></select></label><label class="field">Descrição<textarea id="ev-desc" class="input"></textarea></label><button class="btn primary" onclick="addEvent()">Adicionar evento</button></div></section><div class="grid two"><section class="card"><h3>Calendário</h3>${calendar()}</section><section class="card"><h3>Lista de eventos</h3>${db.events.map(e=>`<div class="item"><div class="between"><b>${e.title}</b><button class="btn danger" onclick="removeItem('events','${e.id}')">Excluir</button></div><p class="muted small">${e.date} ${e.time} · ${e.type} · ${subjectName(e.subjectId)} · ${e.status}</p><p>${e.description}</p></div>`).join('')}</section></div>`)}
function addEvent(){db.events.push({id:uid(),title:$('#ev-title').value||'Novo evento',description:$('#ev-desc').value,date:$('#ev-date').value,time:$('#ev-time').value,type:$('#ev-type').value,subjectId:$('#ev-subject').value,topicId:'',priority:$('#ev-priority').value,status:'pendente'});save();render()}
function materias(){return shell(`<div class="between"><div><h1>Matérias</h1><p class="muted">Organize matérias, tópicos, conteúdos e desempenho.</p></div><button class="btn primary" onclick="addSubject()">Cadastrar matéria</button></div><div class="grid three">${db.subjects.map(s=>{const p=performance({subjectId:s.id});const pr=subjectPriority(s);const next=db.exams.find(e=>e.subjectId===s.id);return`<section class="card"><div class="between"><h3>${s.name}</h3><span class="pill">${pr.label}</span></div><p class="muted">${s.description}</p><p class="small muted">${db.contents.filter(c=>c.subjectId===s.id).length} conteúdos · ${db.questions.filter(q=>q.subjectId===s.id).length} questões</p><p class="small">Próxima prova: ${next?next.date:'sem data'}</p><div class="progress"><div class="bar" style="width:${p.accuracy}%"></div></div><div class="row"><button class="btn" onclick="openSubject('${s.id}')">Detalhes</button><button class="btn" onclick="editSubject('${s.id}')">Editar</button><button class="btn danger" onclick="removeItem('subjects','${s.id}')">Excluir</button></div></section>`}).join('')}</div>`)}
function openSubject(id,tab='geral'){db.selectedSubject=id;db.subjectTab=tab;save();route('materia')}
function materia(){const s=by(db.subjects,db.selectedSubject)||db.subjects[0];const tabs=[['geral','Visão geral'],['conteudos','Conteúdos'],['questoes','Questões'],['flashcards','Flashcards'],['arquivos','Arquivos'],['provas','Provas'],['desempenho','Desempenho']];const active=db.subjectTab||'geral';const topics=db.topics.filter(t=>t.subjectId===s.id);const contents=db.contents.filter(c=>c.subjectId===s.id);return shell(`<button class="btn" onclick="route('materias')">← Matérias</button><section class="card"><div class="between"><div><h1>${s.name}</h1><p class="muted">${s.description}</p></div><span class="pill">Prioridade ${subjectPriority(s).label}</span></div><div class="grid four"><div><b>${performance({subjectId:s.id}).accuracy}%</b><p class="muted small">desempenho</p></div><div><b>${contents.length}</b><p class="muted small">conteúdos</p></div><div><b>${topics.length}</b><p class="muted small">tópicos</p></div><div><b>${db.events.filter(e=>e.subjectId===s.id).length}</b><p class="muted small">eventos</p></div></div></section><div class="tabs">${tabs.map(t=>`<button class="${active===t[0]?'active':''}" onclick="openSubject('${s.id}','${t[0]}')">${t[1]}</button>`).join('')}</div>${subjectTab(s,active)}`)}
function subjectTab(s,tab){if(tab==='conteudos')return `<section class="card"><div class="between"><h3>Conteúdos e tópicos</h3><button class="btn primary" onclick="addContent('${s.id}')">Adicionar conteúdo</button></div>${db.topics.filter(t=>t.subjectId===s.id).map(t=>`<div class="item"><b>${t.title}</b><p class="muted small">${t.status} · dificuldade ${t.difficulty} · prioridade ${t.priority}</p>${db.contents.filter(c=>c.topicId===t.id).map(c=>`<div class="card flat"><b>${c.title}</b><p class="muted small">${c.type} · ${c.status} · última revisão ${c.lastReviewedAt}</p><p>${c.description}</p>${c.fileUrl?`<p><a class="pill" href="${c.fileUrl}" target="_blank">PDF/arquivo</a></p>`:''}${c.externalLink?`<p><a class="pill" href="${c.externalLink}" target="_blank">Link externo</a></p>`:''}<button class="btn" onclick="markContent('${c.id}','estudado')">Marcar estudado</button> <button class="btn" onclick="markContent('${c.id}','revisar')">Revisar depois</button> <button class="btn danger" onclick="removeItem('contents','${c.id}')">Excluir</button></div>`).join('')}</div>`).join('')}</section>`;if(tab==='questoes')return `<section class="card"><h3>Questões vinculadas</h3>${db.questions.filter(q=>q.subjectId===s.id).map(q=>`<div class="item"><b>${q.statement}</b><p class="muted small">${topicName(q.topicId)} · ${contentName(q.contentId)} · ${q.difficulty}</p></div>`).join('')}</section>`;if(tab==='flashcards')return `<section class="card"><h3>Flashcards</h3>${db.flashcards.filter(f=>f.subjectId===s.id).map(cardFlash).join('')}</section>`;if(tab==='arquivos')return `<section class="card"><h3>Arquivos e PDFs</h3>${db.contents.filter(c=>c.subjectId===s.id&&(c.fileUrl||c.externalLink)).map(c=>`<div class="item"><b>${c.title}</b><p>${c.fileUrl||c.externalLink}</p></div>`).join('')||'<p class="muted">Nenhum arquivo anexado.</p>'}</section>`;if(tab==='provas')return `<section class="card"><h3>Provas, tarefas e eventos</h3>${[...db.exams.filter(e=>e.subjectId===s.id),...db.events.filter(e=>e.subjectId===s.id)].map(e=>`<div class="item"><b>${e.title}</b><p class="muted small">${e.date} ${e.time}</p></div>`).join('')}</section>`;if(tab==='desempenho')return desempenho(true,s.id);return `<div class="grid two"><section class="card"><div class="between"><h3>Tópicos</h3><button class="btn" onclick="addTopic('${s.id}')">Novo tópico</button></div>${db.topics.filter(t=>t.subjectId===s.id).map(t=>`<div class="item"><b>${t.title}</b><p class="muted small">${t.description}</p><span class="pill">${t.status}</span> <span class="pill">${t.priority}</span></div>`).join('')}</section><section class="card"><h3>Recomendação inteligente</h3>${db.contents.filter(c=>c.subjectId===s.id).map(c=>({c,score:priorityForContent(c)})).sort((a,b)=>b.score-a.score).slice(0,3).map(x=>`<div class="item"><b>${x.c.title}</b><p class="muted small">Prioridade ${priorityLabel(x.score)}</p></div>`).join('')}</section></div>`}
function provas(){return shell(`<div class="between"><h1>Provas</h1><button class="btn primary" onclick="addExam()">Cadastrar prova</button></div><div class="grid two">${db.exams.map(e=>`<section class="card"><div class="between"><h3>${e.title}</h3><button class="btn danger" onclick="removeItem('exams','${e.id}')">Excluir</button></div><p class="muted">${subjectName(e.subjectId)} · ${e.date} ${e.time}</p><p>Conteúdos: ${e.contents.map(contentName).join(', ')}</p><p><span class="pill">${e.preparationStatus}</span> <span class="pill">importância ${e.importance}</span> <span class="pill">${e.difficulty}</span></p><p>${e.notes}</p></section>`).join('')}</div>`)}
function tarefas(){return shell(`<h1>Tarefas</h1><p class="muted">Tarefas são eventos do tipo tarefa, trabalho, revisão ou apresentação.</p><div class="grid two">${db.events.filter(e=>['tarefa','trabalho','revisão','apresentação'].includes(e.type)).map(e=>`<section class="card"><h3>${e.title}</h3><p class="muted">${e.date} ${e.time} · ${subjectName(e.subjectId)}</p><p>${e.description}</p><button class="btn" onclick="eDone('${e.id}')">Concluir</button></section>`).join('')}</div>`)}
function questoes(){if(session)return sessionView();return shell(`<h1>Sessão de estudo por questões</h1><section class="card question"><p class="muted">Escolha filtros e resolva uma questão por vez, com explicação e confiança.</p><div class="form"><label class="field">Matéria<select id="ss" class="input"><option value="">Todas</option>${db.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label class="field">Tópico<select id="st" class="input"><option value="">Todos</option>${db.topics.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}</select></label><label class="field">Conteúdo<select id="sc" class="input"><option value="">Todos</option>${db.contents.map(c=>`<option value="${c.id}">${c.title}</option>`).join('')}</select></label><label class="field">Quantidade<input id="sq" class="input" type="number" value="10"></label><label class="field">Tipo<select id="sty" class="input"><option value="">Todos</option><option>múltipla escolha</option><option>verdadeiro ou falso</option><option>flashcard</option></select></label><label class="field">Dificuldade<select id="sd" class="input"><option value="">Todas</option><option>baixa</option><option>média</option><option>alta</option></select></label><button class="btn primary" onclick="startSession()">Gerar lista</button></div></section>`)}
function startSession(){let qs=db.questions.filter(q=>(!$('#ss').value||q.subjectId===$('#ss').value)&&(!$('#st').value||q.topicId===$('#st').value)&&(!$('#sc').value||q.contentId===$('#sc').value)&&(!$('#sty').value||q.type===$('#sty').value)&&(!$('#sd').value||q.difficulty===$('#sd').value));qs=qs.slice(0,Number($('#sq').value)||10);if(!qs.length)return alert('Nenhuma questão encontrada.');session={qs,index:0,answers:[],selected:'',answered:false,confidence:confidenceLevels[2],xp:0};render()}
function sessionView(){if(session.index>=session.qs.length)return sessionSummary();const q=session.qs[session.index];return shell(`<section class="card question"><p class="muted small">Questão ${session.index+1} de ${session.qs.length} · ${subjectName(q.subjectId)} › ${topicName(q.topicId)} › ${contentName(q.contentId)}</p><h2>${q.statement}</h2>${q.alternatives.map(a=>`<button class="alt ${session.selected===a?'selected':''}" onclick="session.selected='${a.replaceAll("'","&#39;")}';render()" ${session.answered?'disabled':''}>${a}</button>`).join('')}${!session.answered?`<button class="btn primary" onclick="answerSession()">Responder</button>`:`<div class="item"><h3>${session.currentCorrect?'Acertou':'Errou'}</h3><p>${q.explanation}</p><label class="field">Como você se sentiu ao responder essa questão?<select id="confidence" class="input" onchange="session.confidence=this.value">${confidenceLevels.map(c=>`<option ${session.confidence===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="btn primary" onclick="nextQuestion()">${session.index+1===session.qs.length?'Finalizar sessão':'Próxima questão'}</button></div>`}</section>`)}
function answerSession(){if(!session.selected)return alert('Escolha uma alternativa.');const q=session.qs[session.index];session.currentCorrect=session.selected===q.correctAnswer;session.answered=true;render()}
function nextQuestion(){const q=session.qs[session.index];const record={id:uid(),questionId:q.id,userId:db.user.id,subjectId:q.subjectId,topicId:q.topicId,contentId:q.contentId,selectedAnswer:session.selected,isCorrect:session.currentCorrect,confidenceLevel:session.confidence,createdAt:new Date().toISOString()};db.attempts.push(record);const gain=session.currentCorrect?15:6;session.xp+=gain;db.user.xp+=gain;session.answers.push(record);session.index++;session.selected='';session.answered=false;session.confidence=confidenceLevels[2];save();render()}
function sessionSummary(){const total=session.answers.length,correct=session.answers.filter(a=>a.isCorrect).length;const weak=[...new Set(session.answers.filter(a=>!a.isCorrect||['Chutei','Estava muito incerta'].includes(a.confidenceLevel)).map(a=>a.contentId))].map(contentName);const suggestion=db.contents.map(c=>({c,score:priorityForContent(c)})).sort((a,b)=>b.score-a.score)[0];const html=shell(`<section class="card question"><h1>Sessão concluída</h1><div class="grid four"><div><b>${total}</b><p class="muted small">respondidas</p></div><div><b>${correct}</b><p class="muted small">acertos</p></div><div><b>${total-correct}</b><p class="muted small">erros</p></div><div><b>${Math.round(correct/total*100)}%</b><p class="muted small">taxa de acerto</p></div></div><p><b>XP ganho:</b> ${session.xp}</p><p><b>Revisar:</b> ${weak.join(', ')||'nenhum conteúdo crítico'}</p><p><b>Sugestão:</b> ${suggestion.c.title}</p><button class="btn primary" onclick="session=null;route('questoes')">Nova sessão</button></section>`);session=null;save();return html}
function flashcards(){return shell(`<div class="between"><h1>Flashcards</h1><button class="btn primary" onclick="addFlashcard()">Novo flashcard</button></div><div class="grid two">${db.flashcards.map(cardFlash).join('')}</div>`)}
function cardFlash(f){return`<section class="card"><p class="muted small">${subjectName(f.subjectId)} › ${topicName(f.topicId)} › ${contentName(f.contentId)}</p><h3>${f.front}</h3><details class="item"><summary>Ver verso</summary><p>${f.back}</p></details><label class="field">Resultado da revisão<select class="input" id="rv-${f.id}">${reviewResults.map(r=>`<option>${r}</option>`).join('')}</select></label><button class="btn" onclick="reviewFlash('${f.id}')">Salvar revisão</button></section>`}
function desempenho(embed=false,subjectId=''){const perfAll=performance(subjectId?{subjectId}:{});const rows=db.subjects.filter(s=>!subjectId||s.id===subjectId).map(s=>({s,p:performance({subjectId:s.id}),pr:subjectPriority(s)}));const html=`<section class="card"><h1>Desempenho</h1><div class="grid four"><div><b>${perfAll.accuracy}%</b><p class="muted small">geral</p></div><div><b>${perfAll.total}</b><p class="muted small">questões</p></div><div><b>${perfAll.confidence}%</b><p class="muted small">confiança média</p></div><div><b>${db.flashcardReviews.length}</b><p class="muted small">revisões flashcard</p></div></div><table class="table"><thead><tr><th>Matéria</th><th>Desempenho</th><th>Prioridade</th><th>Questões</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.s.name}</td><td>${r.p.accuracy}%</td><td>${r.pr.label}</td><td>${r.p.total}</td></tr>`).join('')}</tbody></table><h3>Conteúdos mais fracos</h3>${db.contents.map(c=>({c,score:priorityForContent(c)})).sort((a,b)=>b.score-a.score).slice(0,5).map(x=>`<div class="item"><b>${x.c.title}</b><p class="muted small">${subjectName(x.c.subjectId)} · prioridade ${priorityLabel(x.score)}</p></div>`).join('')}</section>`;return embed?html:shell(html)}
function config(){return shell(`<h1>Configurações</h1><div class="grid two"><section class="card"><h3>Preferências</h3><label class="field">Nome<input id="cfg-name" class="input" value="${db.user.name}"></label><label class="field">Meta diária de questões<input id="cfg-daily" class="input" type="number" value="${db.user.dailyGoal}"></label><label class="field">Meta semanal<input id="cfg-weekly" class="input" type="number" value="${db.user.weeklyGoal}"></label><button class="btn primary" onclick="saveConfig()">Salvar</button></section><section class="card"><h3>Dados</h3><p class="muted">Exportação futura preparada. Hoje os dados ficam no LocalStorage.</p><button class="btn" onclick="setTheme(db.theme==='dark'?'light':'dark');render()">Alternar tema</button> <button class="btn danger" onclick="resetDemo()">Zerar dados fictícios</button></section></div>`)}
function addSubject(){const name=prompt('Nome da matéria');if(!name)return;db.subjects.push({id:uid(),name,description:prompt('Descrição curta')||'',color:'#2f6f5e',createdAt:today});save();render()}function editSubject(id){const s=by(db.subjects,id);const name=prompt('Nome',s.name);if(name){s.name=name;s.description=prompt('Descrição',s.description)||s.description;save();render()}}function addTopic(subjectId){const title=prompt('Título do tópico');if(!title)return;db.topics.push({id:uid(),subjectId,title,description:prompt('Descrição')||'',difficulty:'média',status:'não iniciado',priority:'média'});save();render()}function addContent(subjectId){const topicId=prompt('ID do tópico ou deixe vazio para o primeiro',db.topics.find(t=>t.subjectId===subjectId)?.id||'');const title=prompt('Título do conteúdo');if(!title)return;db.contents.push({id:uid(),subjectId,topicId:topicId||db.topics.find(t=>t.subjectId===subjectId)?.id,title,type:prompt('Tipo: texto escrito, PDF, link externo, imagem, vídeo ou arquivo complementar','texto escrito')||'texto escrito',description:prompt('Descrição')||'',body:prompt('Corpo do texto, se houver')||'',fileUrl:prompt('URL do PDF/arquivo, se houver')||'',externalLink:prompt('Link externo, se houver')||'',status:'novo',lastReviewedAt:today,createdAt:today});save();render()}function markContent(id,status){const c=by(db.contents,id);c.status=status;c.lastReviewedAt=today;save();render()}
function addExam(){const title=prompt('Título da prova');if(!title)return;const s=db.subjects[0];db.exams.push({id:uid(),title,subjectId:s.id,date:prompt('Data','2026-05-20')||today,time:prompt('Horário','08:00')||'08:00',topics:[],contents:[],difficulty:'média',importance:Number(prompt('Importância 1-10','8')||8),preparationStatus:'não comecei',notes:prompt('Observações')||''});save();render()}function addFlashcard(){const c=db.contents[0];const front=prompt('Frente');if(!front)return;db.flashcards.push({id:uid(),subjectId:c.subjectId,topicId:c.topicId,contentId:c.id,front,back:prompt('Verso')||'',difficulty:'média',lastReviewedAt:today,mastery:'baixo'});save();render()}function reviewFlash(id){const f=by(db.flashcards,id);const result=$('#rv-'+id).value;f.lastReviewedAt=today;f.mastery=result==='muito fácil'||result==='lembrei bem'?'alto':result==='lembrei parcialmente'?'médio':'baixo';db.flashcardReviews.push({id:uid(),flashcardId:id,userId:db.user.id,reviewResult:result,createdAt:new Date().toISOString()});db.user.xp+=result==='errei'?4:10;save();render()}function eDone(id){by(db.events,id).status='concluído';db.user.xp+=8;save();render()}function saveConfig(){db.user.name=$('#cfg-name').value;db.user.dailyGoal=Number($('#cfg-daily').value);db.user.weeklyGoal=Number($('#cfg-weekly').value);save();render()}function resetDemo(){if(confirm('Restaurar dados fictícios?')){localStorage.removeItem(key);db=clone(seed);setTheme(db.theme);render()}}function removeItem(arr,id){if(!confirm('Excluir item?'))return;db[arr]=db[arr].filter(x=>x.id!==id);save();render()}function startSmartStudy(){const top=db.contents.map(c=>({c,score:priorityForContent(c)})).sort((a,b)=>b.score-a.score)[0];session={qs:db.questions.filter(q=>q.contentId===top.c.id),index:0,answers:[],selected:'',answered:false,confidence:confidenceLevels[2],xp:0};if(!session.qs.length){session=null;alert('Nenhuma questão vinculada ao conteúdo prioritário.')}route('questoes')}
function render(){const map={dashboard,agenda,materias,materia,provas,tarefas,questoes,flashcards,desempenho,config};$('#root').innerHTML=(map[db.route]||dashboard)()}render();
</script>
</body>
</html>
